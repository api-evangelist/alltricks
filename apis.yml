name: Alltricks
description: >-
  Alltricks is a French online retailer specializing in cycling, running, and
  outdoor / mountain-sports equipment. Founded in 2008 and headquartered near
  Paris in Saint-Cyr-l'Ecole (Yvelines), France, the company sells bikes and
  frames, components and parts, apparel, footwear, nutrition, and accessories
  across France and multiple European markets. Alltricks operates as a
  direct-to-consumer e-commerce storefront at alltricks.fr and was an early
  Partech portfolio company. As of this pipeline run the company publishes no
  public developer API, developer portal, OpenAPI definition, or /.well-known/
  discovery surface; this profile captures its identity and the domain-security
  posture of its production host.
